services:
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: 
      - .env
    environment:
      - NODE_ENV=test
      - DB_HOST=db-test
      - DB_PORT=3306
      - DB_NAME=api_test
      - DB_PASSWORD=test_password
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - REDIS_PASSWORD=test_redis_pass
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_started
    command: npm run docker:test 

  db-test:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: api_test
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "test_redis_pass"]